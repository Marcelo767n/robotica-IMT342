<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>IRB 120 · Hito 2 en vivo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: consola de ingeniería — barra de entrada de pose arriba, riel de criterios de la rúbrica a la izquierda,
   mesa de trabajo (vista 3D + gráficas sincronizadas) a la derecha. */
:root {
  --bg: #eef2f5; --surface: #ffffff; --sunken: #f6f8fa; --ink: #132130; --muted: #566778; --line: #d3dbe3; --grid: #e3e8ee;
  --accent: #1d5fc4; --accent-soft: #dfe9f8; --amber: #b56a00; --ok: #17844a; --ok-soft: #dcf1e5; --bad: #c03a2b; --bad-soft: #f8e1de;
  --j1: #1d5fc4; --j2: #d9480f; --j3: #2b8a3e; --j4: #9c36b5; --j5: #c2255c; --j6: #0b7285;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141b; --surface: #151e28; --sunken: #111921; --ink: #e5ecf2; --muted: #93a3b3; --line: #263443; --grid: #1f2b38;
    --accent: #6ea4ff; --accent-soft: #1b2c45; --amber: #f0a33a; --ok: #4cc283; --ok-soft: #133324; --bad: #ff7b6b; --bad-soft: #3a1c18;
    --j1: #6ea4ff; --j2: #ff8a4c; --j3: #63c174; --j4: #c98cdb; --j5: #f06595; --j6: #3bc9db;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #151e28; --sunken: #111921; --ink: #e5ecf2; --muted: #93a3b3; --line: #263443; --grid: #1f2b38;
  --accent: #6ea4ff; --accent-soft: #1b2c45; --amber: #f0a33a; --ok: #4cc283; --ok-soft: #133324; --bad: #ff7b6b; --bad-soft: #3a1c18;
  --j1: #6ea4ff; --j2: #ff8a4c; --j3: #63c174; --j4: #c98cdb; --j5: #f06595; --j6: #3bc9db;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: 1.7rem; }
h2 { font-size: 2.1rem; }
h3 { font-size: 1.25rem; }
p { margin: 0; max-width: 68ch; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand small { color: var(--muted); font-size: 0.78rem; }
.pose-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
.pose-form label { display: flex; flex-direction: column; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.04em; }
.pose-form input { width: 5.6em; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--sunken); font-family: var(--font-mono); font-size: 0.86rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.78rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunken); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.verdict { font-size: 0.85rem; font-weight: 600; padding: 4px 10px; border-radius: 4px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.err { color: var(--bad); font-size: 0.85rem; }

/* ---------- estructura ---------- */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 0; min-height: 70vh; }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding-block: 14px; position: sticky; top: 112px; align-self: start; max-height: calc(100vh - 112px); overflow-y: auto; }
.rail a { display: grid; grid-template-columns: 2.1em 1fr; gap: 4px; align-items: baseline; padding: 7px 14px; text-decoration: none; color: var(--ink); border-left: 3px solid transparent; }
.rail a .crit { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--muted); }
.rail a small { grid-column: 2; color: var(--muted); font-size: 0.74rem; }
.rail a[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-soft); }
.rail a[aria-current="true"] .crit { color: var(--accent); }
main { padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
section.view { display: flex; flex-direction: column; gap: 18px; max-width: 1240px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
.badge { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; padding: 2px 10px; border-radius: 3px; background: var(--ink); color: var(--surface); letter-spacing: 0.04em; }
.rubric { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 26px; }
.rubric ul { margin: 4px 0 0; padding-left: 1.1em; }
.rubric li { margin: 2px 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h3 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
canvas.view3d { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; display: block; background: var(--sunken); border-radius: 4px; cursor: grab; touch-action: none; }
canvas.chart { width: 100%; height: 170px; display: block; }
canvas.chart.tall { height: 230px; }
.hint { font-size: 0.78rem; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
td.l, th.l { text-align: left; }
td a { font-family: var(--font-body); }
td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr.sel td { background: var(--ok-soft); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--accent-soft); }
.pill { display: inline-block; font-family: var(--font-body); font-size: 0.74rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: 0.88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.eq { font-family: var(--font-mono); background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: 0.82rem; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.controls label { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; }
input[type="range"] { accent-color: var(--accent); width: 160px; }
.checks { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 22px; }
.check { display: grid; grid-template-columns: 1.4em minmax(0, 1fr); gap: 6px; font-size: 0.86rem; align-items: baseline; }
.check b { color: var(--ok); }
.check.fail b { color: var(--bad); }
.steps { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.step { flex: 1 1 130px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.step:hover { border-color: var(--accent); }
.step .crit { font-family: var(--font-display); font-weight: 700; color: var(--accent); }
.step .out { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
.qa details { border-bottom: 1px solid var(--line); padding: 8px 0; }
.qa summary { cursor: pointer; font-weight: 600; }
.qa p { margin-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.78rem; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.branchbar { display: flex; flex-wrap: wrap; gap: 6px; }
.branchbar button { font-size: 0.8rem; padding: 4px 9px; border-radius: 4px; border: 1px solid var(--line); background: var(--sunken); cursor: pointer; font-family: var(--font-mono); }
.branchbar button[aria-pressed="true"] { outline: 2px solid var(--accent); }
.branchbar button.ok { border-color: var(--ok); color: var(--ok); }
.branchbar button.bad { color: var(--bad); }
.notice { border: 1px dashed var(--bad); background: var(--bad-soft); color: var(--bad); padding: 10px 14px; border-radius: var(--radius); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 4px; }
  .rail a { flex: 0 0 auto; grid-template-columns: auto; border-left: 0; border-bottom: 3px solid transparent; padding: 6px 10px; }
  .rail a small { display: none; }
  .rail a[aria-current="true"] { border-bottom-color: var(--accent); }
  .grid2, .grid3, .rubric, .checks { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>IRB 120 · Hito 2 en vivo</h1>
      <small>IMT-342 Robótica · Andrade · Ayala · Navarro</small>
    </div>
    <form class="pose-form" id="poseForm" autocomplete="off">
      <span class="label" style="align-self:center">Pose objetivo T<sub>d</sub> del TCP</span>
      <label>x [m]<input id="px" type="number" step="0.01" value="0.40"></label>
      <label>y [m]<input id="py" type="number" step="0.01" value="0.10"></label>
      <label>z [m]<input id="pz" type="number" step="0.01" value="0.35"></label>
      <label>roll [°]<input id="pr" type="number" step="1" value="0"></label>
      <label>pitch [°]<input id="pp" type="number" step="1" value="180"></label>
      <label>yaw [°]<input id="pw" type="number" step="1" value="0"></label>
      <button class="btn primary" type="submit">Calcular</button>
    </form>
    <span id="verdict" class="verdict"></span>
  </div>
  <div class="top-inner" style="margin-top:8px">
    <span class="label">Poses de prueba</span>
    <div class="presets" id="presets"></div>
    <span id="formErr" class="err" role="alert"></span>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Secciones por criterio de la rúbrica"></nav>
  <main id="main"></main>
</div>

<script>
/* irb120.js — traducción a JavaScript del paquete Python hito2/irb120 (mismas fórmulas, mismos nombres).
 * Se verifica contra Python con presentacion/verificar_port.mjs (vectores generados por generar_vectores.py).
 * Funciona en el navegador (global IRB) y en Node (module.exports).
 */
(function (root) {
  "use strict";
  const PI = Math.PI;

  // ------------------------------------------------------------------ álgebra mínima
  const eye = (n) => Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 1 : 0)));
  const matmul = (A, B) => A.map((row) => B[0].map((_, j) => row.reduce((s, a, k) => s + a * B[k][j], 0)));
  const transpose = (A) => A[0].map((_, j) => A.map((row) => row[j]));
  const matvec = (A, v) => A.map((row) => row.reduce((s, a, k) => s + a * v[k], 0));
  const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
  const norm = (a) => Math.sqrt(dot(a, a));
  const sub = (a, b) => a.map((x, i) => x - b[i]);
  const add = (a, b) => a.map((x, i) => x + b[i]);
  const scale = (a, s) => a.map((x) => x * s);
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const rot = (T) => T.slice(0, 3).map((r) => r.slice(0, 3));
  const pos = (T) => [T[0][3], T[1][3], T[2][3]];
  const col = (T, k) => [T[0][k], T[1][k], T[2][k]];
  const mod = (x, m) => ((x % m) + m) % m;
  const wrapPi = (a) => mod(a + PI, 2 * PI) - PI; // igual que Python: (a + pi) % (2 pi) - pi
  const deg = (r) => (r * 180) / PI;
  const rad = (d) => (d * PI) / 180;

  // ------------------------------------------------------------------ dh.py
  const DH = [
    { d: 0.29, a: 0.0, alpha: -PI / 2, off: 0 },
    { d: 0.0, a: 0.27, alpha: 0.0, off: -PI / 2 },
    { d: 0.0, a: 0.07, alpha: -PI / 2, off: 0 },
    { d: 0.302, a: 0.0, alpha: PI / 2, off: 0 },
    { d: 0.0, a: 0.0, alpha: -PI / 2, off: 0 },
    { d: 0.072, a: 0.0, alpha: 0.0, off: PI },
  ];
  const TCP_Z_M = 0.15;
  const LIMITS_DEG = [[-165, 165], [-110, 110], [-110, 70], [-160, 160], [-120, 120], [-400, 400]];
  const LIMITS = LIMITS_DEG.map(([a, b]) => [rad(a), rad(b)]);
  const MAX_SPEED_DEG = [250, 250, 250, 320, 320, 420];
  const MAX_SPEED = MAX_SPEED_DEG.map(rad);
  const HOME_Q = [0, 0, 0, 0, 0, 0];

  function dhTransform(theta, p) {
    const t = theta + p.off, ct = Math.cos(t), st = Math.sin(t), ca = Math.cos(p.alpha), sa = Math.sin(p.alpha);
    return [
      [ct, -st * ca, st * sa, p.a * ct],
      [st, ct * ca, -ct * sa, p.a * st],
      [0, sa, ca, p.d],
      [0, 0, 0, 1],
    ];
  }
  function jointFrames(q) {
    const F = [eye(4)];
    for (let i = 0; i < 6; i++) F.push(matmul(F[i], dhTransform(q[i], DH[i])));
    return F;
  }
  const forwardKinematics = (q) => jointFrames(q)[6];
  function tcpTransform() { const T = eye(4); T[2][3] = TCP_Z_M; return T; }
  const forwardKinematicsTcp = (q) => matmul(forwardKinematics(q), tcpTransform());
  const positionError = (A, B) => norm(sub(pos(A), pos(B)));
  function rotationError(A, B) {
    const R = matmul(transpose(rot(A)), rot(B));
    const c = (R[0][0] + R[1][1] + R[2][2] - 1) / 2;
    const s = norm([R[2][1] - R[1][2], R[0][2] - R[2][0], R[1][0] - R[0][1]]) / 2;
    return Math.atan2(s, Math.max(-1, Math.min(1, c)));
  }

  // ------------------------------------------------------------------ transforms.py
  function rpyToMatrix(r, p, y) {
    const cr = Math.cos(r), sr = Math.sin(r), cp = Math.cos(p), sp = Math.sin(p), cy = Math.cos(y), sy = Math.sin(y);
    const Rx = [[1, 0, 0], [0, cr, -sr], [0, sr, cr]];
    const Ry = [[cp, 0, sp], [0, 1, 0], [-sp, 0, cp]];
    const Rz = [[cy, -sy, 0], [sy, cy, 0], [0, 0, 1]];
    return matmul(matmul(Rz, Ry), Rx);
  }
  function poseFromXyzRpyDeg(x, y, z, r, p, yaw) {
    const R = rpyToMatrix(rad(r), rad(p), rad(yaw));
    return [[...R[0], x], [...R[1], y], [...R[2], z], [0, 0, 0, 1]];
  }
  function assertRigid(T, tol = 1e-6) {
    if (!Array.isArray(T) || T.length !== 4 || T.some((r) => r.length !== 4)) throw new Error("La pose debe ser una matriz 4x4.");
    if (T.flat().some((v) => !Number.isFinite(v))) throw new Error("La pose contiene valores no finitos.");
    if ([0, 0, 0, 1].some((v, i) => Math.abs(T[3][i] - v) > tol)) throw new Error("La última fila debe ser [0, 0, 0, 1].");
    const R = rot(T), RtR = matmul(transpose(R), R);
    const orth = Math.max(...RtR.flatMap((r, i) => r.map((v, j) => Math.abs(v - (i === j ? 1 : 0)))));
    if (orth > tol) throw new Error(`R no es ortonormal (max|RᵀR − I| = ${orth.toExponential(2)}).`);
    const det = det3(R);
    if (Math.abs(det - 1) > tol) throw new Error(`det(R) = ${det.toFixed(6)}; una rotación propia exige +1.`);
    return T;
  }
  const det3 = (R) =>
    R[0][0] * (R[1][1] * R[2][2] - R[1][2] * R[2][1]) - R[0][1] * (R[1][0] * R[2][2] - R[1][2] * R[2][0]) +
    R[0][2] * (R[1][0] * R[2][1] - R[1][1] * R[2][0]);

  // ------------------------------------------------------------------ validation.py
  const TOL_P = 1e-6, TOL_R = 1e-6;
  function fkCheck(target, q, tcp = true) {
    const T = tcp ? forwardKinematicsTcp(q) : forwardKinematics(q);
    const ep = positionError(target, T), eR = rotationError(target, T);
    const eF = Math.sqrt(T.flat().reduce((s, v, i) => s + (v - target.flat()[i]) ** 2, 0));
    return { ep, eR, eF, accepted: ep < TOL_P && eR < TOL_R };
  }

  // ------------------------------------------------------------------ pieper.py
  const D1 = DH[0].d, L2 = DH[1].a, A3 = DH[2].a, D4 = DH[3].d, D6 = DH[5].d;
  const L3 = Math.hypot(D4, A3), DELTA = Math.atan2(A3, D4);
  const REACH_MIN = Math.abs(L2 - L3), REACH_MAX = L2 + L3;

  function fitToLimits(angle, lo, hi, ref) {
    let best = null;
    for (let k = -3; k <= 3; k++) {
      const c = angle + 2 * PI * k;
      if (c >= lo - 1e-9 && c <= hi + 1e-9 && (best === null || Math.abs(c - ref) < Math.abs(best - ref))) best = c;
    }
    return best;
  }
  function wristCenter(T) { const z = col(T, 2); return sub(pos(T), scale(z, D6)); }
  function armBranches(W) {
    const [x, y, z] = W, planar = Math.hypot(x, y), height = z - D1, out = [];
    for (const [arm, q1, radial] of [["frente", Math.atan2(y, x), planar], ["atras", Math.atan2(y, x) + PI, -planar]]) {
      const c = (radial * radial + height * height - L2 * L2 - L3 * L3) / (2 * L2 * L3);
      if (Math.abs(c) > 1 + 1e-12) {
        for (const elbow of ["arriba", "abajo"]) out.push({ arm, elbow, real: false, c, q: [NaN, NaN, NaN] });
        continue;
      }
      const base = Math.asin(-Math.max(-1, Math.min(1, c))), alpha = Math.atan2(radial, height);
      for (const [elbow, q3md] of [["arriba", base], ["abajo", PI - base]]) {
        const q3 = wrapPi(q3md + DELTA), eta = PI / 2 + q3 - DELTA;
        const q2 = wrapPi(alpha - Math.atan2(L3 * Math.sin(eta), L2 + L3 * Math.cos(eta)));
        out.push({ arm, elbow, real: true, c, q: [wrapPi(q1), q2, q3] });
      }
    }
    return out;
  }

// ============================================================ estado del pipeline
const S = { spec: PRESETS[0].v, speed: 0.25, ramp: 0.25, t: 0, playing: true, rate: 0.5, branch: 0, section: "resumen" };

function compute() {
  const [x, y, z, r, p, w] = S.spec;
  S.T = R.poseFromXyzRpyDeg(x, y, z, r, p, w);
  S.home = R.analyzePose(R.forwardKinematicsTcp(R.HOME_Q), R.HOME_Q);
  S.rep = R.analyzePose(S.T, R.HOME_Q);
  S.rank = R.rankCandidates(S.rep, R.HOME_Q);
  S.best = S.rank.find((d) => d.rank === 1) || null;
  S.q0 = R.HOME_Q.slice();
  S.full = null;
  if (!S.best) { S.traj = null; return; }
  S.qf = S.best.candidate.q;
  const [vmax, amax] = R.defaultLimits(S.speed, S.ramp);
  S.vmax = vmax; S.amax = amax;
  S.traj = R.planLspb(S.q0, S.qf, vmax, amax);
  const N = 301, tf = S.traj.tf;
  S.ts = Array.from({ length: N }, (_, i) => (tf * i) / (N - 1));
  S.samp = S.ts.map((t) => S.traj.sample(t));
  S.model = R.shoulderModel(S.q0.map((v, i) => 0.5 * (v + S.qf[i])));
  S.tau = S.samp.map(([q, , qdd]) => S.model.components(q[1], qdd[1]));
  S.jac = S.samp.map(([q, qd]) => {
    const J = R.geometricJacobian(q), ra = R.rankAnalysis(J), tw = R.matvec(J, qd);
    return { smin: ra.s[5], rank: ra.rank, v: R.norm(tw.slice(0, 3)), w: R.norm(tw.slice(3)) };
  });
  const H = 1e-6;
  S.vnum = S.ts.map((t) => R.norm(R.scale(R.sub(R.pos(R.forwardKinematicsTcp(S.traj.sample(t + H)[0])), R.pos(R.forwardKinematicsTcp(S.traj.sample(t - H)[0]))), 1 / (2 * H))));
  S.tcpPath = S.samp.map(([q]) => R.pos(R.forwardKinematicsTcp(q)));
  const D = R.sub(S.qf, S.q0).map(Math.abs);
  S.critical = D.map((d, i) => Math.max(d / vmax[i], d / amax[i])).reduce((b, v, i, a) => (v > a[b] ? i : b), 0) + 1;
  S.triangular = S.traj.tf - 2 * S.traj.tb < 1e-6;
}

// ============================================================ utilidades de canvas
function prep(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(10, r.width), h = Math.max(10, r.height);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
function niceTicks(a, b, n = 5) {
  if (!(b > a)) { b = a + 1; }
  const step0 = (b - a) / n, mag = 10 ** Math.floor(Math.log10(step0)), f = step0 / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(a / step) * step; v <= b + 1e-9 * step; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}
/* Gráfica de líneas. o = {series:[{x,y,color,label,dash,width,dots}], xmin,xmax,ymin,ymax, logY, cursor, shades:[{a,b,color}], xlabel, ylabel, vlines, hlines} */
function chart(cv, o) {
  const { ctx, w, h } = prep(cv), ink = tok("--ink"), muted = tok("--muted"), grid = tok("--grid");
  const L = 52, Rm = 12, T = 10, B = 30, pw = w - L - Rm, ph = h - T - B;
  const all = o.series.flatMap((s) => s.y.filter((v) => Number.isFinite(v) && (!o.logY || v > 0)));
  let ymin = o.ymin ?? Math.min(...all), ymax = o.ymax ?? Math.max(...all);
  if (o.logY) { ymin = Math.log10(ymin); ymax = Math.log10(ymax); }
  if (ymax - ymin < 1e-9) { ymin -= 1; ymax += 1; } else if (o.ymin === undefined && !o.logY) { const pad = 0.08 * (ymax - ymin); ymin -= pad; ymax += pad; }
  const xmin = o.xmin, xmax = o.xmax;
  const X = (x) => L + ((x - xmin) / (xmax - xmin)) * pw;
  const Y = (y) => T + (1 - ((o.logY ? Math.log10(y) : y) - ymin) / (ymax - ymin)) * ph;
  ctx.font = "11px " + tok("--font-mono"); ctx.lineWidth = 1;
  (o.shades || []).forEach((s) => { ctx.fillStyle = s.color; ctx.globalAlpha = 0.13; ctx.fillRect(X(s.a), T, X(s.b) - X(s.a), ph); ctx.globalAlpha = 1; });
  const yt = o.logY ? niceTicks(Math.ceil(ymin), Math.floor(ymax), 6).filter(Number.isInteger) : niceTicks(ymin, ymax, 4);
  ctx.strokeStyle = grid; ctx.fillStyle = muted; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  yt.forEach((v) => { const yy = o.logY ? T + (1 - (v - ymin) / (ymax - ymin)) * ph : Y(v); ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(L + pw, yy); ctx.stroke(); ctx.fillText(o.logY ? `1e${v}` : +v.toPrecision(4), L - 6, yy); });
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  niceTicks(xmin, xmax, 6).forEach((v) => { ctx.beginPath(); ctx.moveTo(X(v), T); ctx.lineTo(X(v), T + ph); ctx.stroke(); ctx.fillText(+v.toPrecision(4), X(v), T + ph + 4); });
  ctx.strokeStyle = muted; ctx.strokeRect(L, T, pw, ph);
  if (o.xlabel) { ctx.textAlign = "right"; ctx.fillText(o.xlabel, L + pw, T + ph + 16); }
  if (o.ylabel) { ctx.save(); ctx.translate(12, T + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = "center"; ctx.fillText(o.ylabel, 0, 0); ctx.restore(); }
  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  (o.hlines || []).forEach((l) => { ctx.strokeStyle = l.color; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(L, Y(l.y)); ctx.lineTo(L + pw, Y(l.y)); ctx.stroke(); ctx.setLineDash([]); if (l.label) { ctx.fillStyle = l.color; ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.fillText(l.label, L + 4, Y(l.y) - 2); } });
  o.series.forEach((s) => {
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.width || 1.8; ctx.setLineDash(s.dash || []);
    if (s.dots) { s.x.forEach((x, i) => { if (Number.isFinite(s.y[i]) && (!o.logY || s.y[i] > 0)) { ctx.beginPath(); ctx.arc(X(x), Y(s.y[i]), s.r || 2.4, 0, 7); ctx.fill(); } }); }
    else { ctx.beginPath(); let pen = false; s.x.forEach((x, i) => { const v = s.y[i]; if (!Number.isFinite(v) || (o.logY && v <= 0)) { pen = false; return; } pen ? ctx.lineTo(X(x), Y(v)) : ctx.moveTo(X(x), Y(v)); pen = true; }); ctx.stroke(); }
    ctx.setLineDash([]);
  });
  (o.marks || []).forEach((m) => { ctx.fillStyle = m.color; ctx.beginPath(); ctx.arc(X(m.x), Y(m.y), 5, 0, 7); ctx.fill(); });
  if (o.cursor !== undefined) { ctx.strokeStyle = ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(X(o.cursor), T); ctx.lineTo(X(o.cursor), T + ph); ctx.stroke(); }
  ctx.restore();
}
const legend = (items) => `<div class="legend">${items.map(([c, l, dash]) => `<span><i style="background:${dash ? "none" : c};${dash ? `border-top:2px dashed ${c};height:0` : ""}"></i>${l}</span>`).join("")}</div>`;

// ============================================================ visor 3D (proyección en perspectiva, órbita con arrastre)
class View3D {
  constructor(cv) {
    this.cv = cv; this.az = -0.95; this.el = 0.38; this.dist = 1.55; this.target = [0.2, 0, 0.3];
    let drag = null;
    cv.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY, this.az, this.el]; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
    cv.addEventListener("pointermove", (e) => { if (!drag) return; this.az = drag[2] - (e.clientX - drag[0]) * 0.008; this.el = Math.max(-0.2, Math.min(1.45, drag[3] + (e.clientY - drag[1]) * 0.008)); this.onchange && this.onchange(); });
    cv.addEventListener("pointerup", () => { drag = null; cv.style.cursor = "grab"; });
    cv.addEventListener("wheel", (e) => { e.preventDefault(); this.dist = Math.max(0.8, Math.min(4, this.dist * (1 + Math.sign(e.deltaY) * 0.08))); this.onchange && this.onchange(); }, { passive: false });
  }
  begin() {
    const { ctx, w, h } = prep(this.cv); this.ctx = ctx; this.w = w; this.h = h;
    const ce = Math.cos(this.el), se = Math.sin(this.el), ca = Math.cos(this.az), sa = Math.sin(this.az);
    this.fwd = [-ce * ca, -ce * sa, -se];
    this.eye = R.sub(this.target, R.scale(this.fwd, this.dist));
    this.right = R.scale(R.cross(this.fwd, [0, 0, 1]), 1 / R.norm(R.cross(this.fwd, [0, 0, 1])));
    this.up = R.cross(this.right, this.fwd);
    this.f = Math.min(w, h) * 1.25;
    this.grid();
    return this;
  }
  P(p) { const d = R.sub(p, this.eye), z = R.dot(d, this.fwd); return [this.w / 2 + (this.f * R.dot(d, this.right)) / z, this.h / 2 - (this.f * R.dot(d, this.up)) / z]; }
  line(pts, color, width = 2, dash = [], alpha = 1) {
    const c = this.ctx; c.strokeStyle = color; c.lineWidth = width; c.setLineDash(dash); c.globalAlpha = alpha; c.lineJoin = "round"; c.lineCap = "round";
    c.beginPath(); pts.forEach((p, i) => { const [x, y] = this.P(p); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  }
  dot(p, color, r = 3, alpha = 1) { const [x, y] = this.P(p); const c = this.ctx; c.globalAlpha = alpha; c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.globalAlpha = 1; }
  text(p, s, color) { const [x, y] = this.P(p); const c = this.ctx; c.fillStyle = color || tok("--muted"); c.font = "11px " + tok("--font-mono"); c.fillText(s, x + 5, y - 5); }
  grid() {
    const g = tok("--grid"), m = tok("--muted");
    for (let x = -0.4; x <= 0.71; x += 0.1) this.line([[x, -0.5, 0], [x, 0.5, 0]], g, 1);
    for (let y = -0.5; y <= 0.51; y += 0.1) this.line([[-0.4, y, 0], [0.7, y, 0]], g, 1);
    this.line([[0, 0, 0], [0.15, 0, 0]], tok("--j2"), 1.5); this.line([[0, 0, 0], [0, 0.15, 0]], tok("--j3"), 1.5);
    this.text([0.16, 0, 0], "x", m); this.text([0, 0.16, 0], "y", m);
  }
  frame(T, L = 0.08, dash = [], width = 2) {
    const o = R.pos(T); [["--j2", 0], ["--j3", 1], ["--j1", 2]].forEach(([c, k]) => this.line([o, R.add(o, R.scale(R.col(T, k), L))], tok(c), width, dash));
  }
  robot(q, color, { width = 5, alpha = 1, dash = [], tcpFrame = true } = {}) {
    const F = R.jointFrames(q), pts = F.map((f) => R.pos(f));
    const tcp = R.pos(R.forwardKinematicsTcp(q));
    this.line([[0, 0, 0], [0, 0, R.D1]], tok("--muted"), 9, [], 0.55 * alpha);
    this.line([...pts.slice(1), tcp], color, width, dash, alpha);
    pts.slice(1, 7).forEach((p) => this.dot(p, color, 4, alpha));
    this.dot(tcp, tok("--amber"), 4.5, alpha);
    if (tcpFrame) this.frame(R.forwardKinematicsTcp(q), 0.07, [], 2);
  }
}

  roundTrip() {
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    let ok = 0, rec = 0, wp = 0, wr = 0; const N = 300;
    for (let n = 0; n < N; n++) {
      const q = R.LIMITS.map(([a, b]) => a + (b - a) * rnd());
      const T = R.forwardKinematicsTcp(q), rep = R.analyzePose(T, q);
      if (rep.admissible.length) ok++;
      if (rep.admissible.some((c) => c.q.every((v, i) => Math.abs(v - q[i]) < 1e-6))) rec++;

    }

  },
  rosi() {
    let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647); let worst = 0;
    for (let n = 0; n < 300; n++) {
      const q = R.LIMITS.map(([a, b]) => a + (b - a) * rnd());
      const A = R.forwardKinematics(q), B = R.rosiForwardKinematics(q);
      worst = Math.max(worst, ...A.flat().map((v, i) => Math.abs(v - B.flat()[i])));

    $("#massOut").children[3].innerHTML = `300 configuraciones · max |T_DH − T_ROS-I| = ${fexp(worst)} ${worst < 1e-9 ? '<span class="pill ok">coinciden</span>' : '<span class="pill bad">difieren</span>'}`;
  },
};

    </div>

    <div class="panel qa"><h3>Defensa individual (G1–G4): respuestas cortas</h3>${qa.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</div>`;
  },
  init() {},
};

// ============================================================ navegación y bucle
function current() { return V[S.section]; }
function render() {
  $("#rail").innerHTML = SECTIONS.map((s) => `<a href="#${s.id}" aria-current="${s.id === S.section}"><span class="crit">${s.crit}</span><span>${s.name}</span><small>${s.sub}</small></a>`).join("");
  const vd = $("#verdict"); vd.textContent = S.rep.verdict.split(":")[0] + (S.best ? ` · rama ${S.best.candidate.branch}` : ""); vd.className = "verdict " + (S.rep.reachable ? "ok" : "bad"); vd.title = S.rep.verdict;
  $("#main").innerHTML = `<section class="view" aria-live="polite">${current().html()}</section>`;
  current().init();
  if (current().frame) current().frame();
}
function go() {
  const h = location.hash.replace("#", "");
  S.section = SECTIONS.some((s) => s.id === h) ? h : "resumen";
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", go);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const v = current();
  if (v && v.animated) {
    if (S.section === "singularidad") v.frame(dt);
    else if (S.traj && S.playing) { S.t += dt * S.rate; if (S.t > S.traj.tf + 0.35) S.t = 0; v.frame(); }
  }
  requestAnimationFrame(loop);
}
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
if (reduce.matches) S.playing = false;

$("#presets").innerHTML = PRESETS.map((p) => `<button class="chip" type="button" data-p="${p.id}">${p.name}</button>`).join("");
$("#presets").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const p = PRESETS.find((x) => x.id === b.dataset.p);
  ["px", "py", "pz", "pr", "pp", "pw"].forEach((id, i) => { $("#" + id).value = p.v[i]; });
  $("#poseForm").requestSubmit();
});
$("#poseForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = ["px", "py", "pz", "pr", "pp", "pw"].map((id) => parseFloat($("#" + id).value));
  if (v.some((x) => !Number.isFinite(x))) { $("#formErr").textContent = "Escribe los seis valores numéricos (m y grados)."; return; }
  $("#formErr").textContent = ""; S.spec = v; S.t = 0; S.branch = 0; compute(); render();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });

compute(); go(); requestAnimationFrame(loop);

</script>
