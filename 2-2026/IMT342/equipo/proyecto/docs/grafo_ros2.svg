<text x="45" y="203" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#142438">01  Órdenes y estado del robot</text>
<text x="45" y="229" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#44586c">El nodo del brazo recibe órdenes, valida el movimiento y sincroniza el estado con RViz y el PLC.</text>
<text x="45" y="715" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#142438">02  Gemelo digital en RViz</text>
<text x="45" y="740" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#44586c">Cada publicador convierte los ángulos de los seis ejes en posiciones de las piezas del modelo 3D.</text>
