<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1025" viewBox="0 0 1440 1025" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Mapa de conexiones ROS 2 · ABB IRB 120</title>
<desc id="descripcion">El panel valida las órdenes de RViz, Estudio y la celda PLC, y se comunica por RWS con el IRC5. Dos publicadores convierten los ángulos medidos y objetivo en transformaciones para el gemelo de RViz.</desc>
