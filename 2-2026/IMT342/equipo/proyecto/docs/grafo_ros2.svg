<text x="42" y="116" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#e0e9f5">De la orden de movimiento al gemelo digital en RViz</text>
<text x="1398" y="36" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="end" fill="#c9d6e9">24 NOV 2026   ·   37ca9ee</text>
